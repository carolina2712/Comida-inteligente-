
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Inteligente Móvil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-checkbox:checked + label {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .active-tab {
            border-bottom: 3px solid #60a5fa; /* Lighter blue for better visibility */
            color: #ffffff;
            font-weight: bold;
        }
        /* Improve touch targets for mobile */
        button, label {
            touch-action: manipulation; 
        }
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen pb-10">

    <!-- Header Optimizado para Móviles -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="px-4 py-3 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold flex items-center gap-2 truncate">
                    <i class="fa-solid fa-utensils text-yellow-400"></i> Menú Inteligente
                </h1>
            </div>
            
            <!-- Person Scaler Mobile Friendly -->
            <div class="bg-indigo-800 px-3 py-2 rounded-lg flex items-center justify-between border border-indigo-500/30">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-300"></i>
                    <span class="text-sm font-medium text-indigo-100">Comensales:</span>
                </div>
                <div class="flex items-center">
                     <button onclick="adjustPax(-5)" class="w-8 h-8 bg-indigo-600 rounded-l-md flex items-center justify-center border-r border-indigo-800 active:bg-indigo-500">
                        <i class="fa-solid fa-minus text-xs"></i>
                    </button>
                    <input type="number" id="portion-scale" value="80" min="10" max="500" step="5"
                        class="w-14 bg-indigo-900 h-8 px-1 text-center font-bold text-white focus:outline-none m-0">
                    <button onclick="adjustPax(5)" class="w-8 h-8 bg-indigo-600 rounded-r-md flex items-center justify-center border-l border-indigo-800 active:bg-indigo-500">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Navigation Tabs Mobile Friendly -->
        <div class="flex w-full text-xs sm:text-sm border-t border-indigo-600/50 mt-1">
            <button onclick="switchTab('semana1')" id="tab-semana1" class="flex-1 py-3 text-center active-tab transition-all">Sem 1</button>
            <button onclick="switchTab('semana2')" id="tab-semana2" class="flex-1 py-3 text-center text-indigo-200 hover:text-white transition-all">Sem 2</button>
            <button onclick="switchTab('compras')" id="tab-compras" class="flex-1 py-3 text-center text-indigo-200 hover:text-white transition-all flex items-center justify-center gap-1">
                <i class="fa-solid fa-cart-shopping"></i> Compras
            </button>
        </div>
    </header>

    <main class="px-3 py-4 max-w-xl mx-auto">

        <!-- SEMANA 1 -->
        <section id="content-semana1" class="tab-content space-y-4">
            <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2 mb-1">
                <i class="fa-solid fa-calendar-day text-indigo-600"></i> Semana 1
            </h2>
            <div class="grid gap-4" id="cards-semana1"></div>
        </section>

        <!-- SEMANA 2 -->
        <section id="content-semana2" class="tab-content hidden space-y-4">
             <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2 mb-1">
                <i class="fa-solid fa-calendar-day text-indigo-600"></i> Semana 2
            </h2>
            <div class="grid gap-4" id="cards-semana2"></div>
        </section>

        <!-- LISTA DE COMPRAS INTERACTIVA -->
        <section id="content-compras" class="tab-content hidden space-y-5">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <h2 class="text-lg font-bold text-slate-700">Lista de Compras</h2>
                    <p class="text-xs text-slate-500">Total calculado</p>
                </div>
                <button onclick="resetCheckboxes()" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg active:bg-indigo-200 transition-all font-medium">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Limpiar
                </button>
            </div>

            <div class="grid gap-4" id="shopping-lists-container"></div>
        </section>

    </main>

    <script>
        const basePax = 80;
        let currentPax = 80;

        const rawMenuData = {

                {

                    insumos: [

                        { name: "Cebolla", qty: 2.5, unit: "kg" },
                        { name: "Arroz blanco", qty: 4.5, unit: "kg" },
                        { name: "Plátano maduro", qty: 10, unit: "kg" },

                    ]

                {

                    carbohidrato: "Arroz blanco",
                    acompaniante: "Puré de papas",
                    ensalada: "Pepino y tomate",
                    insumos: [
                        { name: "Muslos de pollo", qty: 16, unit: "kg" },
                        { name: "Salsa BBQ", qty: 1.5, unit: "L" },
                        { name: "Arroz blanco", qty: 4.5, unit: "kg" },
                        { name: "Papa", qty: 12, unit: "kg" },

                    insumos: [

                        { name: "Arroz blanco", qty: 4.5, unit: "kg" },
                        { name: "Pimentón/Zanahoria", qty: 1, unit: "kg" },

                        { name: "Cebolla", qty: 2, unit: "kg" },

                    ]
                }
            ],
            semana2: [
                 {
                    day: "Lunes",
                    title: "Pollo Horno con Batata",
                    proteina: "Pollo al horno",
                    carbohidrato: "Arroz blanco",
                    acompaniante: "Batata horneada",
                    ensalada: "Lechuga, pepino, zanahoria",
                    insumos: [
                        { name: "Pollo (presas)", qty: 16, unit: "kg" },
                        { name: "Cebolla", qty: 2, unit: "kg" },

                    ]
                },
                {
                    day: "Martes",
                    title: "Carne Molida con Papas",
                    proteina: "Carne molida guisada",
                    carbohidrato: "Arroz blanco",
                    acompaniante: "Tajadas al horno",
                    ensalada: "Tomate y maíz",
                    insumos: [
                        { name: "Carne molida", qty: 12, unit: "kg" },
                        { name: "Papa (guiso)", qty: 4, unit: "kg" },
                        { name: "Arroz blanco", qty: 4.5, unit: "kg" },
                        { name: "Plátano maduro", qty: 10, unit: "kg" },
                        { name: "Tomate", qty: 5, unit: "kg" },
                        { name: "Maíz en lata", qty: 2, unit: "latas" }
                    ]
                },
                {
                    day: "Miércoles",
                    title: "Milanesa y Vegetales",
                    proteina: "Milanesas plancha",
                    carbohidrato: "Pasta con queso",
                    acompaniante: "Vegetales al vapor",
                    ensalada: "Ensalada verde",
                    insumos: [
                        { name: "Milanesa pollo", qty: 15, unit: "kg" },
                        { name: "Pasta corta", qty: 6.5, unit: "kg" },
                        { name: "Mantequilla", qty: 0.3, unit: "kg" },
                        { name: "Queso rallado", qty: 1.5, unit: "kg" },
                        { name: "Zanahoria", qty: 4, unit: "kg" },
                        { name: "Vainitas", qty: 3.5, unit: "kg" },
                        { name: "Lechuga mixta", qty: 5, unit: "kg" }
                    ]
                },
                {
                    day: "Jueves",
                    title: "Carne Desmechada",
                    proteina: "Carne desmechada",
                    carbohidrato: "Arroz blanco",
                    acompaniante: "Frijoles negros",
                    ensalada: "Repollo mixto",
                    insumos: [
                        { name: "Carne (falda)", qty: 15, unit: "kg" },
                        { name: "Arroz blanco", qty: 4.5, unit: "kg" },
                        { name: "Frijoles secos", qty: 3.5, unit: "kg" },
                        { name: "Repollo blanco", qty: 3.5, unit: "kg" },
                        { name: "Repollo morado", qty: 3.5, unit: "kg" }
                    ]
                },
                {
                    day: "Viernes",
                    title: "Pollo Salteado",
                    proteina: "Pollo salteado",
                    carbohidrato: "Arroz blanco",
                    acompaniante: "Papas rústicas",
                    ensalada: "Lechuga, tomate, pepino",
                    insumos: [
                        { name: "Pechuga pollo", qty: 14, unit: "kg" },
                        { name: "Cebolla", qty: 2, unit: "kg" },
                        { name: "Pimentón", qty: 2, unit: "kg" },
                        { name: "Arroz blanco", qty: 4.5, unit: "kg" },
                        { name: "Papa", qty: 10, unit: "kg" },
                        { name: "Lechuga mixta", qty: 2.5, unit: "kg" },
                        { name: "Tomate", qty: 2.5, unit: "kg" },
                        { name: "Pepino", qty: 2, unit: "kg" }
                    ]
                }
            ]
        };

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            renderMenus();
            renderShoppingList();

            const inputEl = document.getElementById("portion-scale");
            inputEl.addEventListener("change", (e) => {
                updatePax(parseFloat(e.target.value));
            });
        });
        
        function adjustPax(amount) {
            const inputEl = document.getElementById("portion-scale");
            let newVal = parseFloat(inputEl.value) + amount;
            if (newVal < 10) newVal = 10;
            if (newVal > 500) newVal = 500;
            inputEl.value = newVal;
            updatePax(newVal);
        }

        function updatePax(val) {
            if (val && val > 0) {
                currentPax = val;
                renderMenus();
                renderShoppingList();
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.querySelectorAll("header button[id^='tab-']").forEach(el => {
                el.classList.remove("active-tab");
                el.classList.add("text-indigo-200");
                el.classList.remove("text-white");
            });

            document.getElementById(`content-${tabName}`).classList.remove("hidden");
            const activeBtn = document.getElementById(`tab-${tabName}`);
            activeBtn.classList.add("active-tab", "text-white");
            activeBtn.classList.remove("text-indigo-200");
        }

        function formatQty(value) {
            const scaled = (value / basePax) * currentPax;
            return scaled % 1 === 0 ? scaled.toFixed(0) : scaled.toFixed(1);
        }

        function renderMenus() {
            ["semana1", "semana2"].forEach(semana => {
                const container = document.getElementById(`cards-${semana}`);
                container.innerHTML = "";

                rawMenuData[semana].forEach(item => {
                    const card = document.createElement("div");
                    card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
                    
                    let insumosList = item.insumos.map(ins => 
                        `<div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
                            <span class="text-xs text-slate-600 truncate mr-2">${ins.name}</span>
                            <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded whitespace-nowrap">${formatQty(ins.qty)} ${ins.unit}</span>
                        </div>`
                    ).join("");

                    card.innerHTML = `
                        <div class="bg-indigo-50 border-b border-indigo-100 px-4 py-3">
                            <span class="bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase mb-1 inline-block">${item.day}</span>
                            <h3 class="font-bold text-slate-800 leading-tight">${item.title}</h3>
                        </div>
                        <div class="p-4 space-y-4">
                            <!-- Menu Details -->
                            <div class="space-y-2 text-xs">
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-drumstick-bite text-amber-500 mt-0.5 w-4 text-center"></i>
                                    <div class="flex-1 text-slate-600"><span class="font-semibold text-slate-700 block">Proteína:</span> ${item.proteina}</div>
                                </div>
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-bowl-rice text-amber-600 mt-0.5 w-4 text-center"></i>
                                    <div class="flex-1 text-slate-600"><span class="font-semibold text-slate-700 block">Carbohidrato:</span> ${item.carbohidrato}</div>
                                </div>
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-utensil-spoon text-slate-400 mt-0.5 w-4 text-center"></i>
                                    <div class="flex-1 text-slate-600"><span class="font-semibold text-slate-700 block">Guarnición:</span> ${item.acompaniante}</div>
                                </div>
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-leaf text-emerald-500 mt-0.5 w-4 text-center"></i>
                                    <div class="flex-1 text-slate-600"><span class="font-semibold text-slate-700 block">Ensalada:</span> ${item.ensalada}</div>
                                </div>
                            </div>
                            
                            <!-- Insumos Box -->
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-2 text-center">Insumos para ${currentPax} Pax</p>
                                <div>
                                    ${insumosList}
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function renderShoppingList() {
            const totals = {};

            // Accumulate all ingredients
            [...rawMenuData.semana1, ...rawMenuData.semana2].forEach(day => {
                day.insumos.forEach(ins => {
                    const scaledQty = (ins.qty / basePax) * currentPax;
                    const key = `${ins.name}___${ins.unit}`;
                    if (!totals[key]) {
                        totals[key] = { name: ins.name, unit: ins.unit, qty: 0 };
                    }
                    totals[key].qty += scaledQty;
                });
            });

            // Categorize
            const categories = {
                "Carnes y Pollos": [],
                "Víveres Secos": [],
                "Vegetales": [],
                "Lácteos y Otros": []
            };

            Object.values(totals).forEach(item => {
                const nameLower = item.name.toLowerCase();
                if (nameLower.includes("pollo") || nameLower.includes("carne") || nameLower.includes("chuleta") || nameLower.includes("res") || nameLower.includes("milanesa")) {
                    categories["Carnes y Pollos"].push(item);
                } else if (nameLower.includes("arroz") || nameLower.includes("pasta") || nameLower.includes("frijol") || nameLower.includes("pan") || nameLower.includes("bbq")) {
                    categories["Víveres Secos"].push(item);
                } else if (nameLower.includes("mantequilla") || nameLower.includes("leche") || nameLower.includes("queso")) {
                    categories["Lácteos y Otros"].push(item);
                } else {
                    categories["Vegetales"].push(item);
                }
            });

            const container = document.getElementById("shopping-lists-container");
            container.innerHTML = "";

            let catIndex = 0;
            for (const [catName, items] of Object.entries(categories)) {
                if (items.length === 0) continue;

                const box = document.createElement("div");
                box.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200";

                const itemsHTML = items.map((item, idx) => {
                    const id = `chk_${catIndex}_${idx}`;
                    const displayQty = item.qty % 1 === 0 ? item.qty.toFixed(0) : item.qty.toFixed(1);
                    return `
                        <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                            <div class="flex items-center gap-3 flex-1 min-w-0 pr-2">
                                <input type="checkbox" id="${id}" class="custom-checkbox h-5 w-5 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                                <label for="${id}" class="text-sm text-slate-700 truncate block w-full pt-1">${item.name}</label>
                            </div>
                            <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md shrink-0 border border-indigo-100">
                                ${displayQty} ${item.unit}
                            </span>
                        </div>
                    `;
                }).join("");

                box.innerHTML = `
                    <h3 class="font-bold text-sm text-indigo-900 border-b-2 border-indigo-100 pb-2 mb-2 flex justify-between">
                        ${catName}
                        <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 rounded-full">${items.length}</span>
                    </h3>
                    <div>
                        ${itemsHTML}
                    </div>
                `;
                container.appendChild(box);
                catIndex++;
            }
        }

        function resetCheckboxes() {
            document.querySelectorAll(".custom-checkbox").forEach(cb => cb.checked = false);
        }
    </script>
</body>
</html>
